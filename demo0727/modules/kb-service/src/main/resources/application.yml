
# ==================== 服务器配置 ====================
server:
  port: 8082
  tomcat:
    # 放宽连接/请求超时，避免上传大文件（如几十 MB 的 PDF）时连接被重置
    connection-timeout: 120000
    # 拒绝后允许吞掉的请求体大小（避免上传超限文件时连接异常中断）
    max-swallow-size: 100MB

# ==================== 应用配置 ====================
spring:
  application:
    name: kb-service

  # Nacos 服务注册
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

  # 数据源配置（Step 5 起连知识域独立库 enterprise_kb）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:enterprise_kb}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.enterprise.ai.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== AI RAG 配置 ====================
ai:
  rag:
    # Python RAG 引擎地址（FastAPI 服务，端口 8001）
    base-url: ${AI_RAG_BASE_URL:http://localhost:8001}
    # 请求超时（毫秒），RAG 检索+精排+生成较慢，默认 120 秒
    timeout: 120000
    # RAG 检索 top-k
    top-k: 3

# ==================== 文档存储配置 ====================
document:
  upload:
    path: ./uploads
    allowed-extensions: pdf,doc,docx,md,markdown,txt
    max-size-mb: 50

# ==================== Swagger 配置 ====================
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ==================== Actuator 健康检查 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    com.enterprise.ai: debug
    org.springframework.security: info
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

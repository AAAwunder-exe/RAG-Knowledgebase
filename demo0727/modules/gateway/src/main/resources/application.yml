# ==================== 网关配置 ====================
server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: dev

  cloud:
    # Nacos 服务发现（gateway 通过 lb:// 服务名路由）
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

    gateway:
      # 全局 CORS（镜像原单体 SecurityConfig 的全放开配置）
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # 路由级响应超时（毫秒）。上传/RAG 索引/AI 问答较慢，单独放宽到 5 分钟
      routes:
        # ---------------- auth 域：认证 / 用户 / RBAC / 系统配置 / Dashboard ----------------
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/roles/**,/api/permissions/**,/api/system/**,/api/dashboard/**

        # ---------------- kb 域：知识库 / 文档 / 搜索 / AI 问答 / RAG ----------------
        - id: kb-service
          uri: lb://kb-service
          predicates:
            - Path=/api/knowledge-bases/**,/api/documents/**,/api/search/**,/api/ai/**
          metadata:
            response-timeout: 300000

# JWT 密钥：必须与 auth-service 完全一致（此处为 dev profile 值）
security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-2024-enterprise-ai-platform-dev-secret-key-very-long}

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ==================== 日志 ====================
logging:
  level:
    com.enterprise.ai: debug
    org.springframework.cloud.gateway: info

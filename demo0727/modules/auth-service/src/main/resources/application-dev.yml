# ==================== 开发环境配置 ====================
# 激活方式：spring.profiles.active=dev
# 开发环境使用更详细的日志和更小的连接池

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_auth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ai_platform_2024

  data:
    redis:
      host: localhost
      port: 6379

# ==================== 开发环境日志级别 ====================
logging:
  level:
    com.enterprise.ai: debug
    org.springframework.security: debug
    org.mybatis: debug

# ==================== 开发环境 Swagger ====================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ==================== 开发环境 JWT 配置 ====================
security:
  jwt:
    secret: dev-secret-key-2024-enterprise-ai-platform-dev-secret-key-very-long
    expiration: 86400000
    refresh-expiration: 604800000

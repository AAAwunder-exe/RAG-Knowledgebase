
# ==================== 服务器配置 ====================
server:
  port: 8081
  tomcat:
    # 放宽连接/请求超时，避免上传大文件（如几十 MB 的 PDF）时连接被重置
    connection-timeout: 120000
    # 拒绝后允许吞掉的请求体大小（避免上传超限文件时连接异常中断）
    max-swallow-size: 100MB

# ==================== 应用配置 ====================
spring:
  application:
    name: auth-service
  profiles:
    active: dev

  # Nacos 服务注册
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enterprise_auth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ai_platform_2024
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.enterprise.ai.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Security 配置 ====================
security:
  jwt:
    secret: enterprise-ai-platform-secret-key-2024-enterprise-ai-platform-secret-key
    expiration: 86400000
    refresh-expiration: 604800000

# ==================== AI RAG 配置 ====================
ai:
  rag:
    # Python RAG 引擎地址（FastAPI 服务，端口 8001）
    # 本地运行默认 localhost；Docker 部署通过环境变量 AI_RAG_BASE_URL 覆盖为 rag-service
    base-url: ${AI_RAG_BASE_URL:http://localhost:8001}
    # 请求超时（毫秒），RAG 检索+精排+生成较慢，默认 120 秒
    timeout: 120000

# ==================== 文档存储配置 ====================
document:
  upload:
    path: ./uploads

# ==================== Swagger 配置 ====================
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ==================== Actuator 健康检查 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    com.enterprise.ai: debug
    org.springframework.security: info
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

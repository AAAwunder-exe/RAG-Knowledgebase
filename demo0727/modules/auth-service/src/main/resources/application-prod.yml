# ==================== 生产环境配置 ====================
# 激活方式：spring.profiles.active=prod
# 生产环境使用更严格的安全配置和更高的性能参数

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:enterprise_auth}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

# ==================== 生产环境日志级别 ====================
logging:
  level:
    com.enterprise.ai: ${LOG_LEVEL:info}
    org.springframework.security: warn
    org.mybatis: warn

# ==================== 生产环境关闭 Swagger ====================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

# ==================== 生产环境 JWT 配置 ====================
security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

# ==================== 生产环境文档存储 ====================
document:
  upload:
    path: ${UPLOAD_PATH:/app/uploads}

# ==================== 生产环境 MyBatis-Plus（覆盖父级 StdOutImpl，关闭 SQL 日志） ====================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
